<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Age Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h2>Age Calculator</h2>
    <form
      class="container"
      onsubmit="
        calculateAge();
        return false;
      "
    >
      <label for="dob">Enter Your Date of Birth:</label>
      <input class="dob" type="date" id="dob" required />
      <input class="btn" type="submit" value="Calculate Age" />
      <p id="result"></p>
    </form>
    <script src="script.js"></script>
  </body>
</html>
